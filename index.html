<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scratch Nộp Bài</title>

  <style>
    body{
      margin:0;
      font-family: Arial;
      background:#f3f3f3;
    }

    .topbar{
      background:#ff4d4d;
      padding:10px;
      display:flex;
      align-items:center;
      gap:10px;
      color:white;
    }

    .topbar button{
      background:#1e3cff;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:4px;
      cursor:pointer;
      font-weight:bold;
    }

    .project-name{
      padding:8px;
      width:200px;
      border:none;
      border-radius:4px;
    }

    iframe{
      width:100%;
      height:calc(100vh - 60px);
      border:none;
      background:white;
    }

    #loading{
      position:fixed;
      inset:0;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:24px;
      z-index:999;
    }
  </style>
</head>

<body>

<div id="loading">
  Đang tải Scratch...
</div>

<div class="topbar">
  <button onclick="nopBai()">📤 Nộp Bài Cho Thầy</button>

  <input class="project-name"
         id="projectName"
         placeholder="Tên project"/>
</div>

<iframe
  id="scratchFrame"
  src="https://scratch.mit.edu/projects/editor/?tutorial=getStarted">
</iframe>

<script src="script.js"></script>

</body>
</html>
